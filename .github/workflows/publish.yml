name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # trusted publisher 与 provenance 都依赖 OIDC

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@^11.5.0 # trusted publishing 需要 npm 11.5+

      - name: Publish
        # 首个版本用 NPM_TOKEN 发布：npm 的 trusted publisher 只能挂在已存在的包上，
        # 待包创建并配好 trusted publisher 后，删掉 env 即可回到纯 OIDC
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
