name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Pack and inspect
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const pkg = require("./pack.json")[0];
            const files = pkg.files.map((f) => f.path);
            const must = [
              "src/build.ts",
              "src/runtime.ts",
              "src/host.ts",
              "src/ui.ts",
              "src/ui-exports.ts",
              "src/index.ts",
              "bin/build-plugin.ts",
              "README.md",
              "LICENSE",
            ];
            const missing = must.filter((f) => !files.includes(f));
            if (missing.length) {
              console.error("tarball 缺少文件：" + missing.join(", "));
              process.exit(1);
            }
            console.log(`tarball ${files.length} 个文件，${pkg.unpackedSize} B`);
          '
